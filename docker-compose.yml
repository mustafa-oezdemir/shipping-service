services:
  shipping-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "${SHIPPING_DB_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - shipping_mysql:/var/lib/mysql

  shipping-app:
    build: .
    restart: unless-stopped
    depends_on:
      shipping-db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8090
      APP_URL: ${APP_URL:-http://localhost:8090}
      GIN_MODE: ${GIN_MODE:-debug}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DATABASE_DSN_DOCKER: ${DATABASE_DSN_DOCKER:-}
      MYSQL_HOST: shipping-db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-30s}
      ECOMMERCE_TO_SHIPPING_TOKEN: ${ECOMMERCE_TO_SHIPPING_TOKEN:-${ECOMMERCE_SERVICE_TOKEN:-}}
      ECOMMERCE_SERVICE_TOKEN: ${ECOMMERCE_SERVICE_TOKEN:-}
      ECOMMERCE_TO_SHIPPING_PREVIOUS_TOKEN: ${ECOMMERCE_TO_SHIPPING_PREVIOUS_TOKEN:-}
      ECOMMERCE_CALLBACK_URL: ${ECOMMERCE_CALLBACK_URL:-}
      ECOMMERCE_API_URL: ${ECOMMERCE_API_URL:-}
      ECOMMERCE_PUBLIC_URL: ${ECOMMERCE_PUBLIC_URL:-}
      SHIPPING_TO_ECOMMERCE_TOKEN: ${SHIPPING_TO_ECOMMERCE_TOKEN:-${ECOMMERCE_CALLBACK_TOKEN:-}}
      INTERNAL_QR_SECRET: ${INTERNAL_QR_SECRET:?set INTERNAL_QR_SECRET in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SESSION_TTL: ${SESSION_TTL:-12h}
      PROFILE_IMAGE_DIRECTORY: /app/data/profile-images
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_FIRST_NAME: ${INITIAL_ADMIN_FIRST_NAME:-Shipping}
      INITIAL_ADMIN_LAST_NAME: ${INITIAL_ADMIN_LAST_NAME:-Administrator}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-5s}
      OUTBOX_RETRY_BASE_DELAY: ${OUTBOX_RETRY_BASE_DELAY:-30s}
      OUTBOX_PROCESSING_STALE_AFTER: ${OUTBOX_PROCESSING_STALE_AFTER:-2m}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-10s}
      WAREHOUSE_NAME: ${WAREHOUSE_NAME:-NordShop Logistics Center}
      WAREHOUSE_COMPANY: ${WAREHOUSE_COMPANY:-NordShop GmbH}
      WAREHOUSE_STREET: ${WAREHOUSE_STREET:-Musterstrasse}
      WAREHOUSE_HOUSE_NUMBER: ${WAREHOUSE_HOUSE_NUMBER:-10}
      WAREHOUSE_POSTAL_CODE: ${WAREHOUSE_POSTAL_CODE:-35039}
      WAREHOUSE_CITY: ${WAREHOUSE_CITY:-Marburg}
      WAREHOUSE_COUNTRY: ${WAREHOUSE_COUNTRY:-DE}
    ports:
      - "${SHIPPING_HOST_PORT:-8090}:8090"
    volumes:
      - shipping_profile_images:/app/data/profile-images
    networks:
      default:
      pehlione-backend:
        aliases:
          - shipping-app

volumes:
  shipping_mysql:
  shipping_profile_images:

networks:
  pehlione-backend:
    external: true
    name: pehlione-backend
